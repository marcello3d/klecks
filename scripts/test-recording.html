<!DOCTYPE html>
<!-- The page scripts/test-recording.mjs drives: the embed with a draft and a recording.
     ?w=&h=      canvas size (default 1200×900)
     ?fail=N     the next N draft saves fail
     ?noencoder  no VideoEncoder in this page
     The draft is kept in IndexedDB, so a reload resumes it. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Klecks recording test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<script>
    const q = new URLSearchParams(location.search);
    if (q.has('noencoder')) {
        delete window.VideoEncoder;
    }
</script>
<script src="/dist/embed.js"></script>
<script>
    const db = new Promise((resolve, reject) => {
        const request = indexedDB.open('klecks-recording-test', 1);
        request.onupgradeneeded = () => request.result.createObjectStore('drafts');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
    const idb = async (mode, fn) => {
        const tx = (await db).transaction('drafts', mode);
        const request = fn(tx.objectStore('drafts'));
        return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve(request.result);
            tx.onerror = () => reject(tx.error);
        });
    };
    window.draftState = { saves: 0, failed: 0, tail: null, pieces: 0, bytes: 0 };
    let failLeft = Number(q.get('fail') || 0);
    window.failNextSaves = (n) => (failLeft = n);
    const flushes = [];
    window.flushDraft = () => Promise.all(flushes.map((f) => f()));
    window.clearDraft = () => idb('readwrite', (store) => store.delete('draft'));
    // moves a draft to another browser (as another device opening it would)
    const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
    const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    window.exportDraft = async () => {
        const d = await idb('readonly', (store) => store.get('draft'));
        return { format: d.format, tail: b64(d.tail), pieces: d.pieces.map(b64) };
    };
    window.importDraft = (d) =>
        idb('readwrite', (store) => store.put({ format: d.format, tail: unb64(d.tail), pieces: d.pieces.map(unb64) }, 'draft'));

    window.ready = (async () => {
        let saved = (await idb('readonly', (store) => store.get('draft'))) ?? null;
        window.klecks = new Klecks({
            recording: true,
            onSubmit: (onSuccess) => onSuccess(),
            draft: {
                saved,
                store: {
                    save: async ({ format, append, tail, fresh }) => {
                        if (failLeft > 0) {
                            failLeft--;
                            draftState.failed++;
                            throw new Error('test: save failed');
                        }
                        const pieces = fresh ? append : [...saved.pieces, ...append];
                        saved = { format, pieces, tail };
                        await idb('readwrite', (store) => store.put(saved, 'draft'));
                        draftState.saves++;
                        draftState.tail = JSON.parse(new TextDecoder().decode(tail));
                        draftState.pieces = pieces.length;
                        draftState.bytes = pieces.reduce((a, p) => a + p.length, 0);
                    },
                    changed: () => {},
                    onFlush: (flush) => flushes.push(flush),
                    unreadable: (error) => console.error('draft could not be opened', error),
                },
            },
        });
        klecks.openProject({
            width: Number(q.get('w') || 1200),
            height: Number(q.get('h') || 900),
            layers: [
                { name: 'Background', opacity: 1, image: { fill: '#fff' } },
                { name: 'Layer 1', opacity: 1, image: { fill: 'transparent' } },
            ],
        });
    })();

    // Plays each clip in a <video>: its size, duration, and how close its last frame is to
    // the PNG (PSNR, at the video's size, over white).
    window.checkRecording = async () => {
        const clips = await klecks.getRecording();
        const out = [];
        for (const blob of clips) {
            const v = document.createElement('video');
            v.muted = true;
            v.playsInline = true;
            v.src = URL.createObjectURL(blob);
            try {
                await new Promise((ok, no) => {
                    v.onloadeddata = ok;
                    v.onerror = () => no(new Error('video error ' + (v.error && v.error.message)));
                    setTimeout(() => no(new Error('video load timeout')), 10000);
                });
            } catch (e) {
                out.push({ bytes: blob.size, error: e.message });
                continue;
            }
            const info = { bytes: blob.size, width: v.videoWidth, height: v.videoHeight, duration: v.duration };
            v.currentTime = Math.max(0, v.duration - 1 / 60);
            await new Promise((ok) => { v.onseeked = ok; setTimeout(ok, 5000); });
            const c = document.createElement('canvas');
            c.width = v.videoWidth;
            c.height = v.videoHeight;
            const cx = c.getContext('2d', { willReadFrequently: true });
            cx.drawImage(v, 0, 0);
            info.lastFrame = cx.getImageData(0, 0, c.width, c.height).data;
            out.push(info);
        }
        // the PNG, as the video shows it: white under, scaled to the last clip's size
        const last = out.at(-1);
        if (last && last.lastFrame) {
            const img = await createImageBitmap(await klecks.getPNG());
            const c = document.createElement('canvas');
            c.width = last.width;
            c.height = last.height;
            const cx = c.getContext('2d', { willReadFrequently: true });
            cx.fillStyle = '#fff';
            cx.fillRect(0, 0, c.width, c.height);
            cx.drawImage(img, 0, 0, c.width, c.height);
            const a = cx.getImageData(0, 0, c.width, c.height).data;
            const b = last.lastFrame;
            let se = 0;
            for (let i = 0; i < a.length; i += 4) {
                for (let k = 0; k < 3; k++) {
                    const d = a[i + k] - b[i + k];
                    se += d * d;
                }
            }
            last.psnr = 10 * Math.log10((255 * 255) / (se / ((a.length / 4) * 3) || 1e-9));
        }
        out.forEach((o) => delete o.lastFrame);
        return out;
    };
</script>
</body>
</html>
