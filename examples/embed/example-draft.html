<!DOCTYPE html>
<!-- mocked drawing page that keeps a draft: draw, reload, and the drawing is still there.
     It records a timelapse too: "Play recording" shows it, and logs what the recorder did. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Draw (draft)</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
</head>
<body>
<button id="play-recording" style="position: fixed; left: 8px; bottom: 8px; z-index: 1000">Play recording</button>

<script src="../../dist/embed.js"></script>
<script type="text/javascript">
    // A minimal draft store: the whole draft in one IndexedDB record. A real store would add the
    // new pieces without writing the old ones again.
    const db = new Promise((resolve, reject) => {
        const request = indexedDB.open('klecks-example-draft', 1);
        request.onupgradeneeded = () => request.result.createObjectStore('drafts');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
    const idb = async (mode, fn) => {
        const tx = (await db).transaction('drafts', mode);
        const request = fn(tx.objectStore('drafts'));
        return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve(request.result);
            tx.onerror = () => reject(tx.error);
        });
    };

    (async () => {
        let saved = (await idb('readonly', (store) => store.get('draft'))) ?? null;
        const flushes = [];
        const klecks = new Klecks({
            recording: true,
            onSubmit: async (onSuccess) => {
                await idb('readwrite', (store) => store.delete('draft'));
                onSuccess();
            },
            draft: {
                saved,
                store: {
                    save: async ({ format, append, tail, fresh }) => {
                        const pieces = fresh ? append : [...saved.pieces, ...append];
                        saved = { format, pieces, tail };
                        await idb('readwrite', (store) => store.put(saved, 'draft'));
                    },
                    changed: () => {},
                    onFlush: (flush) => flushes.push(flush),
                    unreadable: (error) => console.error('draft could not be opened', error),
                },
            },
        });
        // used when there's no draft yet, or it can't be read
        klecks.openProject({
            width: 500,
            height: 500,
            layers: [{ name: 'Background', opacity: 1, image: { fill: '#fff' } }],
        });
        // the recording: one <video> per clip, played in order
        document.getElementById('play-recording').onclick = async () => {
            console.log('recording', klecks.getRecordingInfo());
            const clips = await klecks.getRecording();
            if (!clips.length) {
                alert('No recording (this browser has no H.264 VideoEncoder?)');
                return;
            }
            const box = document.createElement('div');
            box.style.cssText = 'position:fixed;inset:0;z-index:1001;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center';
            const video = document.createElement('video');
            video.muted = true;
            video.playsInline = true;
            video.controls = true;
            video.style.cssText = 'max-width:90vw;max-height:90vh;background:#fff';
            let i = 0;
            const next = () => {
                if (i < clips.length) {
                    video.src = URL.createObjectURL(clips[i++]);
                    video.play();
                }
            };
            video.onended = next;
            box.onclick = (e) => e.target === box && box.remove();
            box.append(video);
            document.body.append(box);
            next();
        };
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                flushes.forEach((flush) => flush());
            }
        });
    })();
</script>

</body>
</html>
